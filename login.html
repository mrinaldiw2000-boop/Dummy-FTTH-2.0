<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FTTH Enterprise Project Dashboard</title>

  <!-- Google Fonts & Bootstrap 5 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome & Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    .login-hero-wrapper {
      min-height: 100vh;
      background: linear-gradient(135deg, rgba(15, 61, 145, 0.95), rgba(11, 26, 61, 0.98)),
                  url('https://images.unsplash.com/photo-1544197150-b99a580bb7a8?q=80&w=1600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-xl);
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      color: #FFFFFF;
    }

    .brand-logo-container {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent-color), #FF4500);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: #FFFFFF;
      box-shadow: 0 10px 25px rgba(255, 122, 0, 0.4);
      margin-bottom: 1rem;
    }

    .login-input-group {
      position: relative;
      margin-bottom: 1.4rem;
    }

    .login-input-group i {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.6);
    }

    .login-input-group input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 3rem;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .login-input-group input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .login-input-group input:focus {
      outline: none;
      border-color: var(--accent-color);
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 0 4px rgba(255, 122, 0, 0.25);
    }

    .default-credential-pill {
      background: rgba(255, 255, 255, 0.15);
      border: 1px dashed rgba(255, 255, 255, 0.3);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      font-size: 0.82rem;
      text-align: center;
      margin-top: 1.5rem;
    }

    .btn-demo-access {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      border-radius: var(--radius-md);
      padding: 0.65rem 1rem;
      font-size: 0.88rem;
      font-weight: 600;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      text-decoration: none;
    }

    .btn-demo-access:hover {
      background: rgba(255, 255, 255, 0.28);
      color: #FFFFFF;
      border-color: #FFFFFF;
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-screen" class="hidden">
    <div class="spinner-ftth mb-3"></div>
    <div class="fw-bold text-primary">FTTH Enterprise System</div>
  </div>

  <div class="login-hero-wrapper">
    <div class="login-card animate__animated animate__zoomIn">
      <div class="brand-logo-container">
        <div class="brand-logo-icon">
          <i class="fas fa-sitemap"></i>
        </div>
        <h2 class="fw-bold m-0">Project FTTH</h2>
        <p class="text-white-50 fs-6 mt-1">Enterprise Reporting Dashboard</p>
      </div>

      <form id="login-form">
        <div class="login-input-group">
          <i class="fas fa-user"></i>
          <input type="text" id="username" placeholder="Username (Default: admin)" value="admin" required>
        </div>

        <div class="login-input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Password (Default: 12345)" value="12345" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 text-white-50 fs-7">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember-me" checked>
            <label class="form-check-label text-white-50" for="remember-me">Remember Me</label>
          </div>
          <a href="#" id="forgot-password-btn" class="text-white-50 text-decoration-none">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-ftth-accent w-100 py-3 rounded-3 fs-6 mb-3">
          <i class="fas fa-sign-in-alt me-2"></i> Log In
        </button>

        <a href="dashboard.html" id="demo-access-btn" class="btn-demo-access">
          <i class="fas fa-desktop text-warning"></i> Langsung Masuk ke Dashboard (Demo Access)
        </a>
      </form>

      <div class="default-credential-pill text-white-50">
        <i class="fas fa-key me-1 text-warning"></i> Default User: <strong class="text-white">admin</strong> | Password: <strong class="text-white">12345</strong>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/sample-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
  <script>
    // Safeguard auto-hide loading screen
    setTimeout(function() {
      var ls = document.getElementById('loading-screen');
      if (ls) ls.classList.add('hidden');
    }, 200);
  </script>
</body>
</html>
